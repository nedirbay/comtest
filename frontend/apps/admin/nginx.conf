# Nginx drops inherited add_header lines in any block that adds its own, so each location lists all of its own.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # File names carry a hash of their content, so they can be kept for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        # frame-ancestors has no effect in the meta tag that holds the rest of the policy.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
