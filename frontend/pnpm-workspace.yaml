packages:
  - apps/*
  - packages/*

# Versions shared by the workspace live here, so that the apps cannot drift apart.
catalog:
  '@element-plus/icons-vue': ^2.3.2
  '@element-plus/nuxt': ^1.1.5
  '@tanstack/vue-query': ^5.100.0
  '@types/node': ^26.6.5
  '@vitejs/plugin-vue': ^6.0.10
  '@vue/test-utils': ^2.5.1
  element-plus: ^2.13.0
  openapi-fetch: ^0.17.0
  pinia: ^4.0.0
  tailwindcss: ^4.0.0
  typescript: ~5.9.3
  vite: ^8.0.0
  vitest: ^5.0.0
  vue: ^3.5.0
  vue-i18n: ^11.0.0
  vue-router: ^5.0.0
  vue-tsc: ^3.0.0
  zod: ^4.0.0

# A freshly published version has to survive a week before we install it. Most malicious
# releases are found and removed within days.
minimumReleaseAge: 10080

# Install scripts are how compromised packages usually run code, so none run unless listed here
# as true. These are not needed: esbuild's binary ships as a package of its own, and vue-demi
# only uses its script to switch to Vue 2.
allowBuilds:
  esbuild: false
  vue-demi: false
